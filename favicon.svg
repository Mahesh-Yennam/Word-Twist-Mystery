<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lensG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Rounded Shield Icon -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Mystery Scrambled Letter Tiles in Background -->
  <rect x="8" y="10" width="14" height="14" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="15" y="21" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" fill="#f59e0b" text-anchor="middle">W</text>

  <rect x="42" y="10" width="14" height="14" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="49" y="21" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" fill="#38bdf8" text-anchor="middle">T</text>

  <!-- Magnifying Glass Lens -->
  <circle cx="30" cy="34" r="16" fill="url(#lensG)" stroke="url(#goldG)" stroke-width="3"/>
  <!-- Mystery Question Mark / Letter inside Lens -->
  <text x="30" y="40" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">?</text>

  <!-- Magnifying Glass Handle -->
  <path d="M42 46 L54 58" stroke="url(#goldG)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="53" cy="57" r="2" fill="#d97706"/>

  <!-- Reflection Flare -->
  <path d="M22 26 A 12 12 0 0 1 36 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
